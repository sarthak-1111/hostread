# Netlify build settings. Secrets and runtime settings (QLOO_API_KEY, LLM_*,
# JOB_SECRET, RUN_EXECUTION=background, CACHE_BACKEND=blobs) are set in the
# Netlify UI / API, because variables in this file don't reach functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime (server rendering + API routes as functions). Declared
# explicitly because upload-based deploys don't auto-install it.
[[plugins]]
  package = "@netlify/plugin-nextjs"
